<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2a3310">
<meta name="description" content="AssetKeep asset inventory and condition dashboard.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<title>AssetKeep</title>
<style>
:root{--bg:#eef0e3;--card:#fff;--ink:#26301a;--mute:#6b7355;--line:#e1e4cf;--acc:#5b7f12;--onacc:#fff;--side:#2a3310;--sidetxt:#dfe6c4;--actbg:#7da31c;--good:#4d7c0f;--bad:#b4491f;--head:#fff;color-scheme:light;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14180b;--card:#1e2412;--ink:#ecefd9;--mute:#a3aa83;--line:#333c1d;--acc:#a9c93a;--onacc:#14180b;--side:#0e1206;--actbg:#5f7d14;--good:#a3c93a;--bad:#f0925a;--head:#1a2010;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14180b;--card:#1e2412;--ink:#ecefd9;--mute:#a3aa83;--line:#333c1d;--acc:#a9c93a;--onacc:#14180b;--side:#0e1206;--actbg:#5f7d14;--good:#a3c93a;--bad:#f0925a;--head:#1a2010;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:120px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 Figtree,system-ui,-apple-system,"Segoe UI",sans-serif}
.side{position:sticky;top:0;z-index:5;background:var(--side);color:var(--sidetxt);padding-top:env(safe-area-inset-top,0px)}
.logo{display:flex;align-items:center;gap:10px;padding:10px 16px;font-size:20px;font-weight:700;color:#fff}
#nav{display:flex}
#nav button{flex:1;background:none;border:0;color:var(--sidetxt);font:inherit;font-size:13px;padding:8px 0 10px;display:flex;flex-direction:column;align-items:center;gap:2px}
#nav button.on{background:var(--actbg);color:#fff;font-weight:700}
.ic{width:22px;height:22px;flex:none}
.top{background:var(--head);display:flex;align-items:center;gap:14px;padding:10px 16px;border-bottom:1px solid var(--line)}
.top h1{font-size:18px;margin:0;flex:1}
.top button{background:none;border:0;color:var(--ink);padding:4px;position:relative;display:flex}
.badge{position:absolute;top:-3px;right:-4px;background:#d92d20;color:#fff;font-size:11px;font-weight:700;border-radius:99px;min-width:17px;height:17px;display:flex;align-items:center;justify-content:center}
.me{display:flex;align-items:center;gap:8px;font-weight:600}.av{width:32px;height:32px;border-radius:50%;background:var(--acc);color:var(--onacc);display:flex;align-items:center;justify-content:center;font-weight:700}
.me span.nm{display:none}
main{padding:14px;max-width:1100px;margin:0 auto}
.view{display:none}.view.on{display:block}
.card{background:var(--card);border-radius:12px;padding:14px;box-shadow:0 1px 3px rgba(40,50,10,.12)}
h2{font-size:16px;margin:0 0 10px}h3{font-size:16px;margin:0 0 10px;font-weight:600}
.btn{background:var(--acc);color:var(--onacc);border:0;border-radius:8px;padding:11px 14px;font:inherit;font-weight:600;width:100%;text-align:center;cursor:pointer}
.btn.alt{background:transparent;color:var(--acc);border:1px solid var(--acc)}
input[type=text],input[type=number],select{font:inherit;padding:11px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);width:100%}
.row{display:flex;gap:10px;align-items:center}
.narrow{max-width:560px;margin:0 auto}
#reader{width:100%;border-radius:10px;overflow:hidden;margin-bottom:10px}
.msg{color:var(--bad);font-size:14px;margin:8px 0}
.tag{display:inline-block;padding:2px 10px;border-radius:4px;font-size:13px;font-weight:700;letter-spacing:.3px;text-transform:uppercase;color:#fff;background:var(--good)}
.tag.bad{background:var(--bad)}
:root[data-theme="dark"] .tag,.dk .tag{color:#14180b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tag{color:#14180b}}
.pic{width:100%;max-width:380px;aspect-ratio:4/3;object-fit:cover;border-radius:10px;display:block;background:var(--line)}
.detail{margin-top:12px;display:grid;gap:12px}
.fields{display:grid;grid-template-columns:90px 1fr;gap:8px 10px;margin:0}.fields dt{color:var(--mute);font-size:14px}.fields dd{margin:0;font-weight:600}
.qrbox{background:#fff;border-radius:10px;padding:10px;width:fit-content}.qrbox[hidden]{display:none}
.acts{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.card.ri{padding:0;margin-bottom:10px;overflow:hidden}.ri>.detail{padding:0 14px 14px}
.item{display:flex;gap:12px;align-items:center;padding:10px 14px;cursor:pointer}
.item img{width:56px;height:56px;border-radius:8px;object-fit:cover;flex:none}
.item small{color:var(--mute)}.grow{flex:1;min-width:0}
.chev{width:20px;height:20px;color:var(--mute);transition:transform .2s;display:flex}.chev.up{transform:rotate(180deg)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.kc{display:flex;flex-direction:column;min-height:170px}.kt{color:var(--mute);font-size:14px}.kn{font-size:30px;line-height:1.3}
.kb{flex:1;font-size:14px;color:var(--mute)}.kf{border-top:1px solid var(--line);padding-top:8px;margin-top:8px;font-size:14px}
.kc.mid{justify-content:center;text-align:center}.kc.mid .kn{font-size:34px}
.tri{display:inline-block;border:5px solid transparent;margin-left:6px}.tri.u{border-top:0;border-bottom:8px solid var(--good)}.tri.d{border-bottom:0;border-top:8px solid var(--bad)}
.mini{width:100%;height:56px}.mini .g{fill:var(--good)}.mini .b{fill:var(--bad)}.mini .t,.chart .t{fill:var(--mute);font-size:11px}
.pbar{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;border-bottom:1px solid var(--line);margin:-14px -14px 14px;padding:0 14px}
.tabs button,.chips button{background:none;border:0;font:inherit;color:var(--mute);padding:12px 10px;cursor:pointer}
.tabs button.on{color:var(--acc);box-shadow:inset 0 -2px var(--acc)}.chips button.on{color:var(--acc);font-weight:700}
.pbody{display:grid;gap:18px}
.chart{width:100%;height:auto}.chart .g{fill:var(--good)}.chart .b{fill:var(--bad)}.chart .gl{stroke:var(--line)}
.leg{font-size:13px;color:var(--mute);display:flex;gap:14px}.leg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px}
.rk{display:flex;gap:12px;align-items:center;padding:9px 0;cursor:pointer}.rk small{color:var(--mute)}
.bd{width:22px;height:22px;border-radius:50%;background:var(--line);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}.bd.dk{background:var(--side);color:#fff}
@media (min-width:900px){
 body{display:grid;grid-template-columns:230px 1fr;align-items:start}
 .side{height:100vh;padding-top:0}.logo{padding:22px 24px;font-size:22px}
 #nav{flex-direction:column}#nav button{flex-direction:row;gap:14px;font-size:15px;padding:14px 24px;justify-content:flex-start}
 .kpis{grid-template-columns:repeat(4,1fr)}.pbody{grid-template-columns:1fr 280px}
 .me span.nm{display:inline}.top{padding:14px 24px}main{padding:22px 24px}
}
@media (prefers-reduced-motion:reduce){.chev{transition:none}}
</style>
</head>
<body>
<aside class="side">
  <div class="logo"><svg width="32" height="32" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="19" fill="#fff"/><path d="M12 28C12 17 19 11 29 11c0 11-6 17-17 17z" fill="#5b7f12"/><path d="M12 28L24 16" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>AssetKeep</div>
  <nav id="nav"></nav>
</aside>
<div>
<header class="top"><h1 id="pt">Scan</h1>
  <button id="sBtn" aria-label="Search assets"></button>
  <button id="bBtn" aria-label="BAD assets"></button>
  <div class="me"><div class="av">A</div><span class="nm">Admin</span></div>
</header>
<main>
<section class="view on" id="v-scan"><div class="narrow">
  <div class="card">
    <div id="reader"></div>
    <button class="btn" id="camBtn">Start camera</button>
    <div class="msg" id="scanMsg"></div>
    <div class="row" style="margin-top:10px"><input type="number" id="manual" placeholder="Asset number, e.g. 5" inputmode="numeric"><button class="btn alt" id="goBtn" style="width:auto">Find</button></div>
    <label class="btn alt" style="display:block;margin-top:10px">Scan from a QR photo<input type="file" id="qrFile" accept="image/*" hidden></label>
  </div>
  <div id="result" style="margin-top:12px"></div>
</div></section>
<section class="view" id="v-list"><div class="narrow" style="max-width:760px">
  <div class="row" style="margin-bottom:12px"><input type="text" id="q" placeholder="Search item or owner"><select id="fs" style="width:110px"><option value="">All</option><option>GOOD</option><option>BAD</option></select></div>
  <div id="list"></div>
</div></section>
<section class="view" id="v-dash"><div id="dash"></div></section>
</main>
</div>

function onCode(t){
  const raw=String(t||"").trim();
  // Accept plain numbers and common labels such as ASSET-001, A-001, or Asset Number: 1.
  const match=raw.match(/(?:asset\s*(?:number|no\.?|#)?\s*[:#-]?\s*|a\s*[-_:#]?\s*)?0*(\d{1,6})/i);
  if(match){
    const id=parseInt(match[1],10);
    if(A.some(a=>a.id===id)){show(id);return}
  }
  $("#scanMsg").textContent="The QR code was read, but its content (“"+raw.slice(0,70)+"”) does not match an asset number in this inventory.";
}
async function decodeQrImage(file){
  if(!file || !file.type.startsWith("image/")) throw new Error("Please choose an image file.");
  // Decode locally from the uploaded image using jsQR; no photo is sent to a server.
  if(typeof jsQR==="function"){
    const img=new Image();
    const objectUrl=URL.createObjectURL(file);
    try{
      await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=()=>reject(new Error("The image could not be opened."));img.src=objectUrl});
      const maxSide=2200, scale=Math.min(1,maxSide/Math.max(img.naturalWidth,img.naturalHeight));
      const canvas=document.createElement("canvas");
      canvas.width=Math.max(1,Math.round(img.naturalWidth*scale));
      canvas.height=Math.max(1,Math.round(img.naturalHeight*scale));
      const ctx=canvas.getContext("2d",{willReadFrequently:true});
      ctx.drawImage(img,0,0,canvas.width,canvas.height);
      const pixels=ctx.getImageData(0,0,canvas.width,canvas.height);
      const result=jsQR(pixels.data,pixels.width,pixels.height,{ inversionAttempts:"attemptBoth" });
      if(result && result.data) return result.data;
    } finally { URL.revokeObjectURL(objectUrl); }
  }
  // Fallback decoder if the direct image decoder is unavailable.
  if(typeof Html5Qrcode!=="undefined"){
    const reader=new Html5Qrcode("reader");
    return await reader.scanFile(file,false);
  }
  throw new Error("QR decoder could not be loaded. Check your internet connection and try again.");
}

    await scanner.start({facingMode:"environment"},{fps:10,qrbox:220},t=>{onCode(t);scanner.stop().then(camOff).catch(camOff)});
    $("#camBtn").textContent="Stop camera";$("#scanMsg").textContent="";
  }catch(e){camOff();$("#scanMsg").textContent="Camera unavailable here. Allow camera access, or use the number box or QR photo below."}};
$("#goBtn").onclick=()=>{const v=$("#manual").value;if(v)show(v)};
$("#qrFile").onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  $("#scanMsg").textContent="Reading QR code from photo…";
  try{
    const t=await decodeQrImage(f);
    onCode(t);
  }catch(x){
    $("#scanMsg").textContent=(x&&x.message&&x.message.includes("could not be loaded"))
      ? x.message
      : "No readable QR code was found. Try a clearer, well-lit photo with the entire QR code visible.";
  }finally{e.target.value=""}
};

// assets (details open inside this list)
function openRow(id){openId=openId===id?null:id;renderList()}
function openAsset(id){openId=id;$("#q").value="";$("#fs").value="";go("list");renderList();const e=$("#row"+id);if(e)e.scrollIntoView({block:"center"})}
function renderList(){
  const q=$("#q").value.toLowerCase(),fs=$("#fs").value;
  $("#list").innerHTML=A.filter(a=>(!fs||a.status===fs)&&(a.name+a.owner+a.cat).toLowerCase().includes(q)).map(a=>
   `<div class="card ri" id="row${a.id}"><div class="item" onclick="openRow(${a.id})"><img src="${pic(a)}" alt=""><div class="grow"><b>${a.name}</b><br><small>${a.owner}, ${a.cat}</small></div>${tag(a)}<span class="chev ${openId===a.id?"up":""}">${ic(I.chev)}</span></div>${openId===a.id?detail(a):""}</div>`).join("")||"<p>No assets match.</p>";
}
$("#q").oninput=renderList;$("#fs").onchange=renderList;
$("#sBtn").onclick=()=>{go("list");$("#q").focus()};
$("#bBtn").onclick=()=>{$("#fs").value="BAD";go("list");renderList()};

// dashboard
function tally(k){const m={};A.forEach(a=>{(m[a[k]]=m[a[k]]||{GOOD:0,BAD:0})[a.status]++});return m}
function mini(m,st){const e=Object.entries(m),mx=Math.max(1,...e.map(([,v])=>v[st])),w=160/e.length;
  return `<svg viewBox="0 0 160 60" class="mini" role="img" aria-label="${st} by owner">${e.map(([k,v],i)=>{const h=Math.max(3,v[st]/mx*38);return `<rect class="${st==="BAD"?"b":"g"}" x="${i*w+w*.2}" y="${44-h}" width="${w*.6}" height="${h}" rx="3"/><text class="t" x="${i*w+w/2}" y="58" text-anchor="middle">${k}</text>`}).join("")}</svg>`}
function chart(){
  const e=Object.entries(tally(dim)),sr=flt==="ALL"?["GOOD","BAD"]:[flt],mx=Math.max(1,...e.flatMap(([,v])=>sr.map(s=>v[s]))),top=Math.max(4,Math.ceil(mx/4)*4);
  const x0=34,x1=570,y0=200,y1=16,Y=v=>y0-v/top*(y0-y1),gw=(x1-x0)/e.length,bw=Math.min(44,gw/(sr.length+1)),gap=6;
  let s=`<svg viewBox="0 0 580 228" class="chart" role="img" aria-label="Assets by ${dim==="cat"?"category":"owner"}">`;
  for(let i=0;i<=4;i++){const v=top/4*i;s+=`<line class="gl" x1="${x0}" x2="${x1}" y1="${Y(v)}" y2="${Y(v)}"/><text class="t" x="${x0-8}" y="${Y(v)+4}" text-anchor="end">${v}</text>`}
  e.forEach(([k,v],gi)=>{const st=x0+gi*gw+(gw-sr.length*bw-(sr.length-1)*gap)/2;
    sr.forEach((n,si)=>{const x=st+si*(bw+gap),h=y0-Y(v[n]);s+=`<rect class="${n==="BAD"?"b":"g"}" x="${x}" y="${Y(v[n])}" width="${bw}" height="${Math.max(h,0)}" rx="3"/><text class="t" x="${x+bw/2}" y="${Y(v[n])-5}" text-anchor="middle">${v[n]}</text>`});
    s+=`<text class="t" x="${x0+gi*gw+gw/2}" y="220" text-anchor="middle" style="font-size:13px">${k}</text>`});
  return s+"</svg>"}
const kc=(t,n,b,f,c="")=>`<div class="card kc ${c}"><div class="kt">${t}</div><div class="kn">${n}</div>${b!=null?`<div class="kb">${b}</div>`:""}${f?`<div class="kf">${f}</div>`:""}</div>`;
function setDim(d){dim=d;renderDash()}function setFlt(f){flt=f;renderDash()}
function renderDash(){
  const n=A.length,g=A.filter(a=>!bad(a)).length,b=n-g,pg=Math.round(g/n*100),ow=tally("owner"),bl=A.filter(bad);
  $("#dash").innerHTML=`<div class="kpis">
  ${kc("Total assets",n,`<div>GOOD ratio <b>${pg}%</b><i class="tri u"></i></div><div>BAD ratio <b>${100-pg}%</b><i class="tri d"></i></div>`,`Owners ${Object.keys(ow).length}`)}
  ${kc("GOOD",g,mini(ow,"GOOD"),`${pg}% of all assets`)}
  ${kc("BAD",b,mini(ow,"BAD"),`${100-pg}% need attention`)}
  ${kc("Asset health",pg+"%",null,"","mid")}</div>
  <div class="card"><div class="pbar"><div class="tabs">${[["owner","By owner"],["cat","By category"]].map(([k,t])=>`<button class="${dim===k?"on":""}" onclick="setDim('${k}')">${t}</button>`).join("")}</div>
  <div class="chips">${["ALL","GOOD","BAD"].map(f=>`<button class="${flt===f?"on":""}" onclick="setFlt('${f}')">${f}</button>`).join("")}</div></div>
  <div class="pbody"><div><h3>Assets by ${dim==="cat"?"category":"owner"}</h3>${chart()}<div class="leg"><span><i style="background:var(--good)"></i>GOOD</span><span><i style="background:var(--bad)"></i>BAD</span></div></div>
  <div><h3>Needs attention</h3>${bl.map((a,i)=>`<div class="rk" onclick="openAsset(${a.id})"><span class="bd ${i<3?"dk":""}">${i+1}</span><span class="grow">${a.name}</span><small>${a.owner}</small></div>`).join("")||"<p>All assets are GOOD.</p>"}</div></div></div>`;
}
function updBell(){const n=A.filter(bad).length;$("#bn").textContent=n;$("#bn").style.display=n?"flex":"none"}

function go(v){document.querySelectorAll(".view").forEach(s=>s.classList.toggle("on",s.id==="v-"+v));
  document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on",b.dataset.v===v));
  $("#pt").textContent=PAGES.find(p=>p[0]===v)[1];
  if(v!=="scan"&&scanner){scanner.stop().then(camOff).catch(camOff)}
  window.scrollTo(0,0)}
document.querySelectorAll("#nav button").forEach(b=>b.onclick=()=>go(b.dataset.v));
function renderAll(){renderList();renderDash();drawScan();updBell()}
renderAll();go("scan");
if ("serviceWorker" in navigator) { window.addEventListener("load", () => navigator.serviceWorker.register("./service-worker.js").catch(() => {})); }
</script>
</body>
</html>
